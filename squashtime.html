// ── Dynamic Availability System ──────────────────────────────────────────────

function getCoachBlockedKey(coachId) {return `squashtime_coach_blocked_${coachId}`;}

function getCoachBlockedSlots(coachId) {
  try {return JSON.parse(localStorage.getItem(getCoachBlockedKey(coachId)) || '{}');}
  catch {return {};}
}

function toggleCoachBlockedSlot(coachId, dateStr, time) {
  const blocked = getCoachBlockedSlots(coachId);
  const slots = blocked[dateStr] || [];
  if (slots.includes(time)) {
    blocked[dateStr] = slots.filter((s) => s !== time);
    if (!blocked[dateStr].length) delete blocked[dateStr];
  } else {
    blocked[dateStr] = [...slots, time];
  }
  localStorage.setItem(getCoachBlockedKey(coachId), JSON.stringify(blocked));
}

function getCoachBookedSlotsFromSessions(coachId) {
  try {
    const coach = COACHES.find((c) => c.id === coachId);
    if (!coach) return {};
    const all = JSON.parse(localStorage.getItem('squashtime_sessions') || '{}');
    const booked = {};
    Object.values(all).forEach((userSessions) => {
      (userSessions || []).forEach((session) => {
        if (session.coachName === coach.name && session.status === 'active') {
          const dateStr = session.date ? new Date(session.date).toDateString() : null;
          if (dateStr && session.time) {
            booked[dateStr] = [...(booked[dateStr] || []), session.time];
          }
        }
      });
    });
    return booked;
  } catch {return {};}
}

function getBaseAvailability(coachId) {
  const availability = {};
  const today = new Date();
  for (let i = 1; i <= 42; i++) {
    const date = new Date(today);
    date.setDate(today.getDate() + i);
    const hash = (date.getDate() * 13 + coachId * 7 + date.getMonth() * 3) % 10;
    if (hash > 2) {
      const allSlots = ['8:00 AM', '9:00 AM', '10:00 AM', '11:00 AM', '12:00 PM', '1:00 PM', '2:00 PM', '3:00 PM', '4:00 PM', '5:00 PM', '6:00 PM', '7:00 PM', '8:00 PM'];
      const slots = allSlots.filter((_, idx) => (date.getDate() + idx * 3 + coachId * 2) % 4 !== 0);
      if (slots.length > 0) availability[date.toDateString()] = slots;
    }
  }
  return availability;
}

// Real-time availability: base minus blocked minus already-booked
function getCoachAvailability(coachId) {
  const base = getBaseAvailability(coachId);
  const blocked = getCoachBlockedSlots(coachId);
  const booked = getCoachBookedSlotsFromSessions(coachId);
  const result = {};
  for (const [dateStr, slots] of Object.entries(base)) {
    const filtered = slots.filter((slot) =>
    !(blocked[dateStr] || []).includes(slot) &&
    !(booked[dateStr] || []).includes(slot)
    );
    if (filtered.length > 0) result[dateStr] = filtered;
  }
  return result;
}

// Kept for backward-compat — booking.jsx calls getCoachAvailability directly now
const COACH_AVAILABILITY = {};
COACHES.forEach((c) => {COACH_AVAILABILITY[c.id] = getCoachAvailability(c.id);});

function getAvailableCoaches(dateStr, timeSlot) {
  return COACHES.filter((coach) => {
    const slots = getCoachAvailability(coach.id)[dateStr];
    if (!slots) return false;
    if (!timeSlot) return slots.length > 0;
    return slots.includes(timeSlot);
  });
}

function getInitials(name) {
  return name.split(' ').slice(0, 2).map((w) => w[0]).join('');
}

function coachAccentColor(coach) {

// ── Coach Schedule Manager (for Coach Portal) ────────────────────────────────

function CoachScheduleManager({ coach }) {
  const MONTHS_LIST = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const DAYS_LIST = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  const today = new Date();
  const [viewMonth, setViewMonth] = React.useState(today.getMonth());
  const [viewYear, setViewYear] = React.useState(today.getFullYear());
  const [selectedDate, setSelectedDate] = React.useState(null);
  const [tick, setTick] = React.useState(0);

  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstDay; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  function prevMonth() {if (viewMonth === 0) {setViewMonth(11);setViewYear((y) => y - 1);} else setViewMonth((m) => m - 1);}
  function nextMonth() {if (viewMonth === 11) {setViewMonth(0);setViewYear((y) => y + 1);} else setViewMonth((m) => m + 1);}

  function hasBaseSlots(d) {
    if (!d) return false;
    const dt = new Date(viewYear, viewMonth, d);
    if (dt <= today) return false;
    return (getBaseAvailability(coach.id)[dt.toDateString()] || []).length > 0;
  }

  const selStr = selectedDate ? selectedDate.toDateString() : null;
  const baseSlots = selStr ? getBaseAvailability(coach.id)[selStr] || [] : [];
  const blocked = selStr ? getCoachBlockedSlots(coach.id)[selStr] || [] : [];
  const booked = selStr ? getCoachBookedSlotsFromSessions(coach.id)[selStr] || [] : [];

  function handleToggle(time) {
    if (booked.includes(time)) return;
    toggleCoachBlockedSlot(coach.id, selStr, time);
    setTick((t) => t + 1);
  }

  // Slot counts for stats
  const allBlocked = getCoachBlockedSlots(coach.id);
  const totalBlockedCount = Object.values(allBlocked).reduce((s, a) => s + a.length, 0);
  const allBooked = getCoachBookedSlotsFromSessions(coach.id);
  const totalBookedCount = Object.values(allBooked).reduce((s, a) => s + a.length, 0);

  return (
    <div>
      {/* Stats row */}
      <div style={{ display: 'flex', gap: 12, marginBottom: 24, flexWrap: 'wrap' }}>
        {[
        { label: 'Upcoming Bookings', value: totalBookedCount, color: '#f0b429' },
        { label: 'Slots Blocked', value: totalBlockedCount, color: '#e04040' }].
        map((s) =>
        <div key={s.label} style={{ background: '#0a140a', border: '1px solid #182018', borderRadius: 12, padding: '14px 22px', flex: 1 }}>
            <div style={{ fontFamily: "'League Spartan',sans-serif", fontWeight: 900, fontSize: 26, color: s.color }}>{s.value}</div>
            <div style={{ fontFamily: "'Quicksand',sans-serif", fontSize: 12, color: '#4a6050', marginTop: 2 }}>{s.label}</div>
          </div>
        )}
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'auto 1fr', gap: 20, alignItems: 'start' }}>
        {/* Calendar */}
        <div style={{ background: '#091209', border: '1px solid #182018', borderRadius: 14, padding: 20, userSelect: 'none', minWidth: 280 }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
            <button onClick={prevMonth} style={{ background: 'none', border: 'none', color: '#5a8060', fontSize: 22, cursor: 'pointer', padding: '0 8px', lineHeight: 1 }}>‹</button>
            <span style={{ fontFamily: "'League Spartan',sans-serif", fontWeight: 700, color: '#c8e0c8', fontSize: 15 }}>{MONTHS_LIST[viewMonth]} {viewYear}</span>
            <button onClick={nextMonth} style={{ background: 'none', border: 'none', color: '#5a8060', fontSize: 22, cursor: 'pointer', padding: '0 8px', lineHeight: 1 }}>›</button>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: 2, marginBottom: 6 }}>
            {DAYS_LIST.map((d) => <div key={d} style={{ textAlign: 'center', fontSize: 10, fontWeight: 700, color: '#3a5040', fontFamily: "'League Spartan',sans-serif", letterSpacing: '0.06em', paddingBottom: 4 }}>{d}</div>)}
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: 2 }}>
            {cells.map((d, i) => {
              const has = hasBaseSlots(d);
              const dt = d ? new Date(viewYear, viewMonth, d) : null;
              const isSel = dt && selectedDate && dt.toDateString() === selectedDate.toDateString();
              const isPast = dt && dt <= today;
              return (
                <div key={i} onClick={() => {if (has && dt) setSelectedDate(dt);}} style={{
                  aspectRatio: '1', display: 'flex', alignItems: 'center', justifyContent: 'center',
                  borderRadius: 8, fontSize: 13, fontFamily: "'Quicksand',sans-serif", fontWeight: 600,
                  cursor: has ? 'pointer' : 'default',
                  background: isSel ? '#3de05a' : has ? '#0d1f0d' : 'transparent',
                  color: isSel ? '#050d05' : has ? '#a0c8a0' : d && !isPast ? '#3a4e3a' : d ? '#222' : 'transparent',
                  position: 'relative'
                }}>
                  {d}
                  {has && !isSel && <div style={{ position: 'absolute', bottom: 3, left: '50%', transform: 'translateX(-50%)', width: 4, height: 4, borderRadius: '50%', background: '#3de05a60' }} />}
                </div>);

            })}
          </div>
          {/* Legend */}
          <div style={{ marginTop: 16, display: 'flex', flexDirection: 'column', gap: 6, paddingTop: 12, borderTop: '1px solid #182018' }}>
            {[['#3de05a', 'Available'], ['#e04040', 'Blocked by you'], ['#f0b429', 'Booked by player']].map(([c, l]) =>
            <div key={l} style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                <div style={{ width: 10, height: 10, borderRadius: 2, background: c }} />
                <span style={{ fontFamily: "'Quicksand',sans-serif", fontSize: 11, color: '#5a7060' }}>{l}</span>
              </div>
            )}
          </div>
        </div>

        {/* Slot panel */}
        {!selectedDate ?
        <div style={{ background: '#091209', border: '1px solid #182018', borderRadius: 14, padding: '40px 24px', textAlign: 'center' }}>
            <div style={{ fontFamily: "'League Spartan',sans-serif", fontWeight: 700, fontSize: 18, color: '#4a6050', marginBottom: 10 }}>Select a Date</div>
            <div style={{ fontFamily: "'Quicksand',sans-serif", fontSize: 13, color: '#3a5040', lineHeight: 1.7 }}>
              Pick a highlighted date to manage your availability.<br />
              Click any slot to block or unblock it.
            </div>
          </div> :

        <div style={{ background: '#091209', border: '1px solid #182018', borderRadius: 14, padding: '22px' }}>
            <div style={{ fontFamily: "'League Spartan',sans-serif", fontWeight: 800, fontSize: 18, color: '#d0e8d0', marginBottom: 4 }}>
              {selectedDate.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}
            </div>
            <div style={{ fontFamily: "'Quicksand',sans-serif", fontSize: 12, color: '#4a6050', marginBottom: 18 }}>
              Click a slot to toggle availability. Booked slots cannot be modified.
            </div>
            {baseSlots.length === 0 ?
          <div style={{ fontFamily: "'Quicksand',sans-serif", fontSize: 14, color: '#3a5040', padding: '16px 0' }}>No slots for this day.</div> :

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 8 }}>
                {baseSlots.map((slot) => {
              const isBooked = booked.includes(slot);
              const isBlocked = blocked.includes(slot);
              let bg, border, color, label;
              if (isBooked) {bg = '#1a1200';border = '#f0b42940';color = '#f0b429';label = 'Booked';} else
              if (isBlocked) {bg = '#1a0808';border = '#e0404060';color = '#e04040';label = 'Blocked';} else
              {bg = '#0a1e10';border = '#3de05a40';color = '#3de05a';label = 'Available';}
              return (
                <div key={slot} onClick={() => handleToggle(slot)} style={{
                  background: bg, border: `1px solid ${border}`, borderRadius: 10, padding: '12px 8px',
                  cursor: isBooked ? 'not-allowed' : 'pointer',
                  display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4,
                  opacity: isBooked ? 0.7 : 1, transition: 'all 0.14s'
                }}>
                      <span style={{ fontFamily: "'Quicksand',sans-serif", fontWeight: 700, fontSize: 13, color }}>{slot}</span>
                      <span style={{ fontFamily: "'League Spartan',sans-serif", fontWeight: 700, fontSize: 9, color, letterSpacing: '0.1em', textTransform: 'uppercase', opacity: 0.8 }}>{label}</span>
                    </div>);

            })}
              </div>
          }
          </div>
        }
      </div>
    </div>);

}

Object.assign(window, {
  COACHES, COACH_AVAILABILITY, UPCOMING_TOURNAMENTS, FITNESS_COLOR,
  getAvailableCoaches, getCoachAvailability, getBaseAvailability,

// ── Auth Store ───────────────────────────────────────────────────────
const AUTH_KEY = 'squashtime_user';
const USERS_KEY = 'squashtime_users';

function getUsers() {
  try { return JSON.parse(localStorage.getItem(USERS_KEY) || '{}'); } catch { return {}; }
}
function saveUsers(users) { localStorage.setItem(USERS_KEY, JSON.stringify(users)); }
function getCurrentUser() {
  try { return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch { return null; }
}
function setCurrentUser(user) {
  if (user) localStorage.setItem(AUTH_KEY, JSON.stringify(user));
  else localStorage.removeItem(AUTH_KEY);
}
function updateCurrentUser(updates) {
  const user = getCurrentUser();
  if (!user) return;
  const updated = { ...user, ...updates };
  setCurrentUser(updated);
  const users = getUsers();
  if (users[user.email]) { users[user.email] = updated; saveUsers(users); }
  return updated;
}

// ── Player Auth Actions ──────────────────────────────────────────────
function authSignUp(name, email, password, profile = {}) {
  const users = getUsers();
  if (users[email.toLowerCase()]) return { error: 'An account with this email already exists.' };
  const user = {
    id: Date.now().toString(),
    name, email: email.toLowerCase(), password,
    phone: profile.phone || '',
    age: profile.age || '',
    level: profile.level || '',
    role: 'player',
    subscription: null,
    sessionsUsedThisMonth: 0,
    monthKey: new Date().toISOString().slice(0, 7),
    createdAt: new Date().toISOString(),
  };
  users[email.toLowerCase()] = user;
  saveUsers(users);
  setCurrentUser(user);
  return { user };
}

function authSignIn(email, password) {
  const users = getUsers();
  const user = users[email.toLowerCase()];
  if (!user) return { error: 'No account found with this email.' };
  if (user.password !== password) return { error: 'Incorrect password.' };
  setCurrentUser(user);
  return { user };
}

function authSignOut() { setCurrentUser(null); }

function authSetSubscription(tier) {
  return updateCurrentUser({ subscription: tier, sessionsUsedThisMonth: 0, monthKey: new Date().toISOString().slice(0, 7) });
}

function authCheckMonthReset(user) {
  const monthKey = new Date().toISOString().slice(0, 7);
  if (user.monthKey !== monthKey) {
    return updateCurrentUser({ sessionsUsedThisMonth: 0, monthKey });
  }
  return user;
}

function authIncrementSessions() {
  const user = getCurrentUser();
  if (!user) return;
  return updateCurrentUser({ sessionsUsedThisMonth: (user.sessionsUsedThisMonth || 0) + 1 });
}

// Access codes map to coach IDs — only shared with coaches directly
const COACH_ACCESS_CODES = {
  'COACH-REDA-001':    1,
  'COACH-SHEHAB-002':  2,
  'COACH-MENNA-003':   3,
  'COACH-ROSTOM-004':  4,
  'COACH-YOUSSEF-005': 5,
  'COACH-WALID-006':   6,
  'COACH-ALAA-007':    7,
  'COACH-SAMIR-008':   8,
};

function authCoachSignIn(accessCode) {
  const coachId = COACH_ACCESS_CODES[accessCode.trim().toUpperCase()];
  if (!coachId) return { error: 'Invalid access code. Contact SquashTime administration.' };
  const coach = COACHES.find(c => c.id === coachId);
  if (!coach) return { error: 'Coach profile not found.' };
  const user = {
    id: `coach_${coachId}`,
    name: coach.name,
    email: `${coach.name.split(' ')[0].toLowerCase()}@squashtime.com`,
    role: 'coach',
    coachId,
    coachLevel: coach.level,
    subscription: 'coach',
    createdAt: new Date().toISOString(),
  };
  setCurrentUser(user);
  return { user };
}

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

// ── Mini Calendar ─────────────────────────────────────────────────────────────

function MiniCalendar({ onSelectDate, selectedDate, availabilityMap }) {
  const today = new Date();
  const [viewYear, setViewYear] = React.useState(today.getFullYear());
  const [viewMonth, setViewMonth] = React.useState(today.getMonth());

  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstDay; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  function isAvailable(d) {
    if (!d) return false;
    const dt = new Date(viewYear, viewMonth, d);
    if (dt <= today) return false;
    const key = dt.toDateString();
    if (availabilityMap) return !!(availabilityMap[key] && availabilityMap[key].length);
    return COACHES.some(c => {
      const slots = getCoachAvailability(c.id)[key];
      return slots && slots.length > 0;
    });
  }

  function isSelected(d) {
    if (!d || !selectedDate) return false;
    return new Date(viewYear, viewMonth, d).toDateString() === selectedDate.toDateString();
  }
  function isToday(d) {
    if (!d) return false;
    return new Date(viewYear, viewMonth, d).toDateString() === today.toDateString();
  }
  function prevMonth() { if (viewMonth===0){setViewMonth(11);setViewYear(y=>y-1);}else setViewMonth(m=>m-1); }
  function nextMonth() { if (viewMonth===11){setViewMonth(0);setViewYear(y=>y+1);}else setViewMonth(m=>m+1); }

  return (
    <div style={{ background:'#091209',border:'1px solid #182018',borderRadius:14,padding:20,userSelect:'none' }}>
      <div style={{ display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16 }}>
        <button onClick={prevMonth} style={calNavBtn}>‹</button>
        <span style={{ fontFamily:"'League Spartan',sans-serif",fontWeight:700,color:'#c8e0c8',fontSize:15 }}>{MONTHS[viewMonth]} {viewYear}</span>
        <button onClick={nextMonth} style={calNavBtn}>›</button>
      </div>
      <div style={{ display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginBottom:6 }}>
        {DAYS.map(d => <div key={d} style={{ textAlign:'center',fontSize:10,fontWeight:700,color:'#3a5040',fontFamily:"'League Spartan',sans-serif",letterSpacing:'0.06em',paddingBottom:4 }}>{d}</div>)}
      </div>
      <div style={{ display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2 }}>
        {cells.map((d, i) => {
          const avail = isAvailable(d);
          const sel   = isSelected(d);
          const tod   = isToday(d);
          return (
            <div key={i} onClick={() => { if (avail) onSelectDate(new Date(viewYear, viewMonth, d)); }} style={{
              aspectRatio:'1', display:'flex', alignItems:'center', justifyContent:'center',
              borderRadius:8, fontSize:13, fontFamily:"'Quicksand',sans-serif", fontWeight:600,
              cursor: avail ? 'pointer' : 'default',
              background: sel ? '#3de05a' : (avail ? '#0d1f0d' : 'transparent'),
              color: sel ? '#050d05' : (avail ? '#a0c8a0' : (d ? '#2a3a2a' : 'transparent')),
              border: tod && !sel ? '1px solid #3de05a40' : '1px solid transparent',
              transition:'all 0.12s', position:'relative',
            }}>
              {d}
              {avail && !sel && <div style={{ position:'absolute',bottom:3,left:'50%',transform:'translateX(-50%)',width:4,height:4,borderRadius:'50%',background:'#3de05a60' }} />}
            </div>
          );
        })}
      </div>
    </div>
  );
}

          borderRadius:12, padding:'16px 20px', cursor:'pointer',
          display:'flex', gap:14, alignItems:'flex-start', transition:'all 0.15s',
          boxShadow: value===t.id ? '0 0 0 1px #3de05a20' : 'none',
        }}>
          <div style={{ fontSize:22,marginTop:2 }}>{t.icon}</div>
          <div>
            <div style={{ fontFamily:"'League Spartan',sans-serif",fontWeight:700,fontSize:16,color:value===t.id?'#3de05a':'#c0d8c0',marginBottom:3 }}>{t.label}</div>
            <div style={{ fontFamily:"'Quicksand',sans-serif",fontSize:13,color:'#5a7860',lineHeight:1.5 }}>{t.desc}</div>
          </div>
          <div style={{ marginLeft:'auto',width:18,height:18,borderRadius:'50%',border:`2px solid ${value===t.id?'#3de05a':'#2a3e2a'}`,background:value===t.id?'#3de05a':'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:2 }}>
            {value===t.id && <div style={{ width:8,height:8,borderRadius:'50%',background:'#050d05' }} />}
          </div>
        </div>
      ))}
      {!availableTypes.includes('tournament') && (
        <div style={{ background:'#180808',border:'1px solid #2a1010',borderRadius:10,padding:'12px 16px' }}>
          <div style={{ fontFamily:"'Quicksand',sans-serif",fontSize:13,color:'#8a5050' }}>
            This coach offers personal coaching only — tournament sessions are not available.
          </div>
        </div>
      )}
    </div>
  );
}

// ── Tournament Picker ─────────────────────────────────────────────────────────

            background: mode===m?'#3de05a':'#0d150d', border:`1px solid ${mode===m?'#3de05a':'#182018'}`,
            borderRadius:8, padding:'7px 16px', cursor:'pointer',
            fontFamily:"'League Spartan',sans-serif", fontWeight:700, fontSize:12,
            color: mode===m?'#050d05':'#6a8a6a', letterSpacing:'0.06em', textTransform:'uppercase', transition:'all 0.12s',
          }}>{m==='preset'?'Select Tournament':'Enter Manually'}</button>

          {UPCOMING_TOURNAMENTS.map(t => (
            <div key={t.id} onClick={() => onChange(t.name)} style={{
              background: value===t.name?'#0a1e10':'#0d150d',
              border: `1px solid ${value===t.name?'#3de05a':'#182018'}`,
              borderRadius:9, padding:'12px 14px', cursor:'pointer',
              display:'flex', justifyContent:'space-between', alignItems:'center', transition:'all 0.12s',
            }}>
              <div>
                <div style={{ fontFamily:"'League Spartan',sans-serif",fontWeight:700,fontSize:14,color:value===t.name?'#3de05a':'#b0c8b0' }}>{t.name}</div>
                <div style={{ fontFamily:"'Quicksand',sans-serif",fontSize:12,color:'#4a6050' }}>{t.location} · {t.dates}</div>

          <input placeholder="Location (City, State)..." style={inputStyle} />
        </div>

  );
}

// ── Progress Bar ──────────────────────────────────────────────────────────────

function ProgressBar({ step, total, labels }) {
  return (
    <div style={{ marginBottom:28 }}>
      <div style={{ display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8 }}>
        {labels.map((l, i) => (
          <div key={i} style={{ display:'flex',flexDirection:'column',alignItems:'center',flex:1 }}>
            <div style={{
              width:28,height:28,borderRadius:'50%',
              background: i<step?'#3de05a':(i===step?'#3de05a22':'#111a11'),
              border: `2px solid ${i<=step?'#3de05a':'#1e2e1e'}`,
              display:'flex',alignItems:'center',justifyContent:'center',
              fontFamily:"'League Spartan',sans-serif",fontWeight:800,fontSize:12,
              color: i<step?'#050d05':(i===step?'#3de05a':'#2e4030'),
              marginBottom:4, transition:'all 0.2s', zIndex:1, position:'relative',
            }}>
              {i<step?'✓':i+1}
            </div>
            <div style={{ fontSize:10,color:i<=step?'#5a8060':'#2a3a2a',fontFamily:"'League Spartan',sans-serif",fontWeight:600,letterSpacing:'0.05em',textAlign:'center',textTransform:'uppercase' }}>
              {l}
            </div>
          </div>
        ))}
      </div>
      <div style={{ height:2,background:'#111a11',borderRadius:2,position:'relative',marginTop:4 }}>
        <div style={{ height:'100%',background:'#3de05a',borderRadius:2,width:`${(step/(total-1))*100}%`,transition:'width 0.3s ease' }} />
      </div>
    </div>
  );
}

// ── Booking Engine ────────────────────────────────────────────────────────────

function BookingEngine({ onComplete, initialFlow, preselectedCoach, currentUser }) {
  const [flow, setFlow]   = React.useState(preselectedCoach ? 'coach-first' : (initialFlow || null));
  const [step, setStep]   = React.useState(preselectedCoach ? 1 : 0);
  const [selectedDate,  setSelectedDate]  = React.useState(null);
  const [selectedTime,  setSelectedTime]  = React.useState(null);
  const [selectedCoach, setSelectedCoach] = React.useState(preselectedCoach || null);
  const [sessionType,   setSessionType]   = React.useState(null);
  const [tournament,    setTournament]    = React.useState('');
  const [addReport,     setAddReport]     = React.useState(false);

  const isFree = currentUser?.subscription === 'free';

  const defaultInfo = currentUser
    ? { name: currentUser.name, email: currentUser.email, phone: currentUser.phone||'', age: currentUser.age||'', level: currentUser.level||'', forSelf: true }
    : { name:'', email:'', phone:'', level:'', age:'', forSelf:true };
  const [playerInfo, setPlayerInfo] = React.useState(defaultInfo);
  const [bookingFor, setBookingFor] = React.useState('self');

  function reset() { setFlow(null);setStep(0);setSelectedDate(null);setSelectedTime(null);setSelectedCoach(null);setSessionType(null);setTournament('');setAddReport(false);setBookingFor('self');setPlayerInfo(defaultInfo); }

  const dateStr = selectedDate ? selectedDate.toDateString() : null;

  // Get live availability (reads localStorage each time)
  const coachAvail = selectedCoach ? getCoachAvailability(selectedCoach.id) : null;
  const availableSlots = selectedCoach
    ? (dateStr ? (coachAvail[dateStr] || []) : [])
    : (dateStr ? [...new Set(COACHES.flatMap(c => getCoachAvailability(c.id)[dateStr] || []))] : []);

  // Date-first: coaches available for selected slot, with fitness restrictions
  const availableCoachesForSlot = (dateStr && selectedTime) ? getAvailableCoaches(dateStr, selectedTime).filter(c => {
    if (c.level === 'Fitness') {
      if (sessionType === 'tournament') return false;
      if (isFree) return false;
    }
    return true;
  }) : [];

  // Flow chooser
  if (!flow) {
    return (
      <div style={engineWrap}>
        <div style={{ textAlign:'center',marginBottom:32 }}>
          <div style={{ fontFamily:"'League Spartan',sans-serif",fontWeight:900,fontSize:28,color:'#e8f0e8',marginBottom:8 }}>Book a Session</div>
          <div style={{ fontFamily:"'Quicksand',sans-serif",color:'#5a7060',fontSize:15 }}>Choose how you'd like to get started</div>
        </div>
        <div style={{ display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:20 }}>
          {[
            { id:'date-first',  icon:'📅', title:'Pick a Date First',    desc:'Choose your preferred date & time, then see which coaches are available.' },
            { id:'coach-first', icon:'👤', title:'Browse Coaches First', desc:'Explore our coaches, view profiles and rates, then pick a time that works.' },
          ].map(opt => (
            <div key={opt.id} onClick={() => {setFlow(opt.id);setStep(0);}} style={{
              background:'#0d150d',border:'1px solid #182018',borderRadius:16,
              padding:'28px 22px',cursor:'pointer',textAlign:'center',transition:'all 0.18s',
            }}
            onMouseEnter={e=>{e.currentTarget.style.border='1px solid #3de05a';e.currentTarget.style.background='#0a1a0a';}}
            onMouseLeave={e=>{e.currentTarget.style.border='1px solid #182018';e.currentTarget.style.background='#0d150d';}}
            >
              <div style={{ fontSize:36,marginBottom:12 }}>{opt.icon}</div>
              <div style={{ fontFamily:"'League Spartan',sans-serif",fontWeight:800,fontSize:18,color:'#d0e8d0',marginBottom:8 }}>{opt.title}</div>
              <div style={{ fontFamily:"'Quicksand',sans-serif",fontSize:13,color:'#4a6050',lineHeight:1.6 }}>{opt.desc}</div>
            </div>
          ))}
        </div>
        <div style={{ textAlign:'center' }}>
          <span style={{ fontFamily:"'Quicksand',sans-serif",fontSize:13,color:'#3a5040' }}>
            All sessions are conducted live via Zoom · Instant confirmation
          </span>
        </div>
      </div>
    );
  }

  // ── DATE-FIRST FLOW ──────────────────────────────────────────────────────────
  if (flow === 'date-first') {
    const steps = ['Date','Time','Session','Coach','Details'];

    if (step===0) return (
      <div style={engineWrap}>
        <BackBtn onClick={reset} />
        <ProgressBar step={0} total={5} labels={steps} />
        <SectionTitle>Select a Date</SectionTitle>
        <MiniCalendar onSelectDate={d=>{setSelectedDate(d);setSelectedTime(null);setStep(1);}} selectedDate={selectedDate} />
      </div>
    );

    if (step===1) return (
      <div style={engineWrap}>
        <BackBtn onClick={()=>setStep(0)} />
        <ProgressBar step={1} total={5} labels={steps} />
        <SectionTitle>Choose a Time <span style={{ color:'#3de05a' }}>{selectedDate&&selectedDate.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</span></SectionTitle>
        <TimeSlotPicker slots={availableSlots} selected={selectedTime} onSelect={t=>{setSelectedTime(t);setStep(2);}} />
      </div>
    );

    if (step===2) return (
      <div style={engineWrap}>
        <BackBtn onClick={()=>setStep(1)} />
        <ProgressBar step={2} total={5} labels={steps} />
        <SectionTitle>Session Type</SectionTitle>
        <SessionTypePicker value={sessionType} onChange={setSessionType} />
        {sessionType==='tournament' && (
          <div style={{ marginTop:20 }}>
            <Label>Select Tournament</Label>
            <TournamentPicker value={tournament} onChange={setTournament} />
          </div>
        )}
        <NextBtn disabled={!sessionType||(sessionType==='tournament'&&!tournament)} onClick={()=>setStep(3)} label="See Available Coaches →" />
      </div>
    );

    if (step===3) return (
      <div style={engineWrap}>
        <BackBtn onClick={()=>setStep(2)} />
        <ProgressBar step={3} total={5} labels={steps} />
        <SectionTitle>{availableCoachesForSlot.length} Coach{availableCoachesForSlot.length!==1?'es':''} Available</SectionTitle>
        {availableCoachesForSlot.length===0 && (
          <div style={{ color:'#5a7060',fontFamily:"'Quicksand',sans-serif",padding:'20px 0' }}>No coaches available for this slot. Please go back and choose another time.</div>
        )}
        <div style={{ display:'flex',flexDirection:'column',gap:12 }}>
          {availableCoachesForSlot.map(c => (
            <CoachCard key={c.id} coach={c} selected={selectedCoach?.id===c.id} onClick={coach=>setSelectedCoach(coach)} />
          ))}
        </div>
        <NextBtn disabled={!selectedCoach} onClick={()=>setStep(4)} label="Continue with this Coach →" />
      </div>
    );

    if (step===4) return (
      <div style={engineWrap}>
        <BackBtn onClick={()=>setStep(3)} />
        <ProgressBar step={4} total={5} labels={steps} />
        <SectionTitle>Player Details</SectionTitle>
        <BookingForToggle bookingFor={bookingFor} onChange={v=>{setBookingFor(v);setPlayerInfo(v==='self'?defaultInfo:{name:'',email:'',phone:'',age:'',level:'',forSelf:false});}} hasAccount={!!currentUser} />
        <PlayerForm info={playerInfo} onChange={setPlayerInfo} readOnly={bookingFor==='self'&&!!currentUser} />
        <Label>Optional Add-On</Label>
        <ReportAddOnCard value={addReport} onChange={setAddReport} />
        <BookingSummaryCard coach={selectedCoach} date={selectedDate} time={selectedTime} sessionType={sessionType} tournament={tournament} addReport={addReport} />
        <NextBtn disabled={!playerInfo.name||!playerInfo.email} onClick={()=>onComplete({coach:selectedCoach,date:selectedDate,time:selectedTime,sessionType,tournament,playerInfo,addReport})} label="Proceed to Payment →" />
      </div>
    );
  }

  // ── COACH-FIRST FLOW ─────────────────────────────────────────────────────────
  if (flow === 'coach-first') {
    const steps = ['Coach','Date','Time','Session','Details'];

    if (step===0) return (
      <div style={engineWrap}>
        <BackBtn onClick={reset} />
        <ProgressBar step={0} total={5} labels={steps} />
        <SectionTitle>Choose Your Coach</SectionTitle>
        <div style={{ display:'flex',flexDirection:'column',gap:12 }}>
          {COACHES.map(c => {
            const isFitnessLocked = c.level==='Fitness' && isFree;
            return (
              <div key={c.id}>
                <div style={{ position:'relative' }}>
                  <CoachCard coach={c} selected={selectedCoach?.id===c.id} onClick={isFitnessLocked ? undefined : coach=>{setSelectedCoach(coach);setSelectedDate(null);setSelectedTime(null);setStep(1);}} />
                  {isFitnessLocked && (
                    <div style={{ position:'absolute',inset:0,borderRadius:14,background:'rgba(6,12,6,0.75)',display:'flex',alignItems:'center',justifyContent:'center',backdropFilter:'blur(2px)' }}>
                      <div style={{ background:'#0a140a',border:'1px solid #e04040',borderRadius:12,padding:'16px 22px',textAlign:'center',maxWidth:300 }}>
                        <div style={{ fontFamily:"'League Spartan',sans-serif",fontWeight:800,fontSize:15,color:'#e04040',marginBottom:6 }}>Premium Required</div>
                        <div style={{ fontFamily:"'Quicksand',sans-serif",fontSize:13,color:'#8a5050',lineHeight:1.5 }}>Fitness coaching is available to Premium members only.</div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );

    if (step===1) return (
      <div style={engineWrap}>
        <BackBtn onClick={()=>{setStep(0);setSelectedCoach(null);}} />
        <ProgressBar step={1} total={5} labels={steps} />
        <div style={{ display:'flex',gap:12,alignItems:'center',marginBottom:20,background:'#091209',border:'1px solid #182018',borderRadius:12,padding:'12px 16px' }}>
          <CoachAvatar coach={selectedCoach} size="sm" />
          <div>
            <div style={{ fontFamily:"'League Spartan',sans-serif",fontWeight:700,fontSize:16,color:'#d0e8d0' }}>{selectedCoach.name}</div>
            <div style={{ fontFamily:"'Quicksand',sans-serif",fontSize:12,color:'#4a6050' }}>{selectedCoach.title} · ${selectedCoach.price}/hr</div>
          </div>
        </div>
        <SectionTitle>Pick a Date</SectionTitle>
        <MiniCalendar availabilityMap={getCoachAvailability(selectedCoach.id)} onSelectDate={d=>{setSelectedDate(d);setSelectedTime(null);setStep(2);}} selectedDate={selectedDate} />
      </div>
    );

    if (step===2) return (
      <div style={engineWrap}>
        <BackBtn onClick={()=>setStep(1)} />
        <ProgressBar step={2} total={5} labels={steps} />
        <SectionTitle>Choose a Time <span style={{ color:'#3de05a' }}>{selectedDate&&selectedDate.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</span></SectionTitle>
        <TimeSlotPicker
          slots={getCoachAvailability(selectedCoach.id)[dateStr] || []}
          selected={selectedTime}
          onSelect={t=>{setSelectedTime(t);setStep(3);}}
        />
      </div>
    );

    if (step===3) {
      const coachSessionTypes = selectedCoach?.sessionTypes || ['tournament','personal'];
      return (
        <div style={engineWrap}>
          <BackBtn onClick={()=>setStep(2)} />
          <ProgressBar step={3} total={5} labels={steps} />
          <SectionTitle>Session Type</SectionTitle>
          <SessionTypePicker value={sessionType} onChange={setSessionType} availableTypes={coachSessionTypes} />
          {sessionType==='tournament' && (
            <div style={{ marginTop:20 }}>
              <Label>Select Tournament</Label>
              <TournamentPicker value={tournament} onChange={setTournament} />
            </div>
          )}
          <NextBtn disabled={!sessionType||(sessionType==='tournament'&&!tournament)} onClick={()=>setStep(4)} label="Continue →" />
        </div>
      );
    }

    if (step===4) return (
      <div style={engineWrap}>
        <BackBtn onClick={()=>setStep(3)} />
        <ProgressBar step={4} total={5} labels={steps} />
        <SectionTitle>Player Details</SectionTitle>
        <BookingForToggle bookingFor={bookingFor} onChange={v=>{setBookingFor(v);setPlayerInfo(v==='self'?defaultInfo:{name:'',email:'',phone:'',age:'',level:'',forSelf:false});}} hasAccount={!!currentUser} />
        <PlayerForm info={playerInfo} onChange={setPlayerInfo} readOnly={bookingFor==='self'&&!!currentUser} />
        <Label>Optional Add-On</Label>
        <ReportAddOnCard value={addReport} onChange={setAddReport} />
        <BookingSummaryCard coach={selectedCoach} date={selectedDate} time={selectedTime} sessionType={sessionType} tournament={tournament} addReport={addReport} />
        <NextBtn disabled={!playerInfo.name||!playerInfo.email} onClick={()=>onComplete({coach:selectedCoach,date:selectedDate,time:selectedTime,sessionType,tournament,playerInfo,addReport})} label="Proceed to Payment →" />
      </div>
    );
  }

  return null;
}

// ── Shared Sub-Components ─────────────────────────────────────────────────────

const engineWrap = { display:'flex',flexDirection:'column',gap:16,maxWidth:560,margin:'0 auto' };

function BackBtn({ onClick }) {
  return (
    <button onClick={onClick} style={{ background:'none',border:'none',color:'#5a8060',cursor:'pointer',fontFamily:"'League Spartan',sans-serif",fontWeight:700,fontSize:13,letterSpacing:'0.06em',padding:'0 0 4px',display:'flex',alignItems:'center',gap:6,textTransform:'uppercase' }}>← Back</button>
  );
}
function SectionTitle({ children }) {
  return <div style={{ fontFamily:"'League Spartan',sans-serif",fontWeight:800,fontSize:20,color:'#d8eed8',marginBottom:4 }}>{children}</div>;
}
function Label({ children }) {
  return <div style={{ fontFamily:"'League Spartan',sans-serif",fontWeight:700,fontSize:12,color:'#5a7860',letterSpacing:'0.08em',textTransform:'uppercase',marginBottom:10 }}>{children}</div>;
}
function NextBtn({ onClick, disabled, label }) {
  return (
    <button onClick={onClick} disabled={disabled} style={{ width:'100%',background:disabled?'#111a11':'#3de05a',border:'none',borderRadius:12,padding:'15px 24px',fontFamily:"'League Spartan',sans-serif",fontWeight:800,fontSize:16,color:disabled?'#2a3e2a':'#050d05',cursor:disabled?'not-allowed':'pointer',transition:'all 0.15s',letterSpacing:'0.04em',marginTop:8 }}>{label}</button>
  );
}

function BookingForToggle({ bookingFor, onChange, hasAccount }) {
  if (!hasAccount) return null;
  return (
    <div style={{ background:'#091209',border:'1px solid #1e2e1e',borderRadius:12,padding:'14px 16px',marginBottom:4 }}>
      <div style={{ fontFamily:"'League Spartan',sans-serif",fontWeight:700,fontSize:11,color:'#4a6850',letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:10 }}>Who is this session for?</div>
      <div style={{ display:'flex',gap:8 }}>
        {[['self','Me (my account)'],['other','Another player']].map(([v,l]) => (
          <button key={v} onClick={()=>onChange(v)} style={{ flex:1,background:bookingFor===v?'#3de05a':'#0d150d',border:`1px solid ${bookingFor===v?'#3de05a':'#1e2e1e'}`,borderRadius:8,padding:'10px 12px',cursor:'pointer',fontFamily:"'Quicksand',sans-serif",fontWeight:700,fontSize:13,color:bookingFor===v?'#050d05':'#6a8a6a',transition:'all 0.14s' }}>{l}</button>
        ))}
      </div>
      {bookingFor==='self'  && <div style={{ fontFamily:"'Quicksand',sans-serif",fontSize:12,color:'#3a5a3a',marginTop:8 }}>Your account details will be used — nothing to fill in.</div>}
      {bookingFor==='other' && <div style={{ fontFamily:"'Quicksand',sans-serif",fontSize:12,color:'#3a5a3a',marginTop:8 }}>Enter the other player's details below.</div>}
    </div>
  );
}

function PlayerForm({ info, onChange, readOnly = false }) {
  if (readOnly) {
    return (
      <div style={{ background:'#091209',border:'1px solid #1e2e1e',borderRadius:12,padding:'16px 18px',display:'flex',flexDirection:'column',gap:10 }}>
        <div style={{ fontFamily:"'League Spartan',sans-serif",fontWeight:700,fontSize:11,color:'#4a6850',letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:4 }}>Session Player</div>
        {[['Name',info.name],['Email',info.email],['Phone',info.phone||'—'],['Age',info.age||'—'],['Level',info.level||'—']].map(([k,v]) => (
          <div key={k} style={{ display:'flex',justifyContent:'space-between' }}>
            <span style={{ fontFamily:"'Quicksand',sans-serif",fontSize:13,color:'#4a6050' }}>{k}</span>
            <span style={{ fontFamily:"'Quicksand',sans-serif",fontSize:13,color:'#a0c8a0',fontWeight:600 }}>{v}</span>
          </div>
        ))}

  const [method, setMethod] = React.useState('card');

  const [processing, setProcessing] = React.useState(false);
  const [errors, setErrors] = React.useState({});

  const methods = [

    { id: 'paypal', label: 'PayPal', icon: '🅿' },
    { id: 'venmo', label: 'Venmo', icon: '✦' },
  ];

  function formatCardNumber(v) {
    return v.replace(/\D/g,'').slice(0,16).replace(/(.{4})/g,'$1 ').trim();
  }
  function formatExpiry(v) {
    const digits = v.replace(/\D/g,'').slice(0,4);
    return digits.length > 2 ? digits.slice(0,2) + '/' + digits.slice(2) : digits;
  }

  function validate() {
    if (method !== 'card') return true;
    const e = {};
    if (card.number.replace(/\s/g,'').length < 16) e.number = 'Enter a valid 16-digit card number';
    if (!card.name.trim()) e.name = 'Cardholder name required';
    if (card.expiry.length < 5) e.expiry = 'Enter valid expiry MM/YY';
    if (card.cvv.length < 3) e.cvv = 'Enter valid CVV';
    setErrors(e);
    return Object.keys(e).length === 0;
  }

  function handlePay() {
    if (!validate()) return;
    setProcessing(true);
    // generate zoom link here so we can pass it to onSuccess
    const zoomLink = `https://zoom.us/j/${Math.floor(Math.random()*900000000+100000000)}?pwd=${Math.random().toString(36).slice(2,12)}`;
    setTimeout(() => { setProcessing(false); onSuccess(zoomLink); }, 2800);
  }

  // Detect card brand from number
  function cardBrand(num) {
    const n = num.replace(/\s/g,'');
    if (n.startsWith('4')) return 'Visa';
    if (/^5[1-5]/.test(n)) return 'Mastercard';
    if (/^3[47]/.test(n)) return 'Amex';
    if (n.startsWith('6')) return 'Discover';
    return null;
  }
  const brand = cardBrand(card.number);

  if (processing) return (

        Sending confirmation emails

    </div>
  );

const SESSIONS_KEY = 'squashtime_sessions';

function getUserSessions(email) {
  if (!email) return [];
  try {
    const all = JSON.parse(localStorage.getItem(SESSIONS_KEY) || '{}');
    return all[email.toLowerCase()] || [];
  } catch { return []; }
}

function saveUserSession(email, session) {
  if (!email) return;
  try {
    const all = JSON.parse(localStorage.getItem(SESSIONS_KEY) || '{}');
    const key = email.toLowerCase();
    all[key] = [session, ...(all[key] || [])];
    localStorage.setItem(SESSIONS_KEY, JSON.stringify(all));
  } catch {}
}

function updateSessionResult(email, sessionId, result) {
  if (!email) return;
  try {
    const all = JSON.parse(localStorage.getItem(SESSIONS_KEY) || '{}');
    const key = email.toLowerCase();
    all[key] = (all[key] || []).map(s => s.id === sessionId ? { ...s, result, status: 'history' } : s);
    localStorage.setItem(SESSIONS_KEY, JSON.stringify(all));
  } catch {}
}

function buildSession(booking, zoomLink) {
  return {
    id: Date.now().toString(),
    coachName: booking.coach.name,
    coachTitle: booking.coach.title,
    coachLevel: booking.coach.level,
    coachPrice: booking.coach.price,
    date: booking.date ? booking.date.toISOString() : null,
    time: booking.time,
    sessionType: booking.sessionType,
    tournament: booking.tournament || null,
    zoomLink,
    playerName: booking.playerInfo.name,
    playerEmail: booking.playerInfo.email,
    addReport: booking.addReport || false,
    status: 'active',
    result: null,
    bookedAt: new Date().toISOString(),
  };
}

          ['Time', session.time],
          ['Type', session.sessionType === 'tournament' ? 'Tournament Coaching' : 'Personal Training'],
          ['Player', session.playerName],
          ...(session.tournament ? [['Tournament', session.tournament]] : []),
          ['Rate', `$${session.coachPrice}/hr`],
        ].map(([k, v]) => (
          <div key={k}>
            <div style={{ fontFamily: "'League Spartan',sans-serif", fontWeight: 700, fontSize: 10, color: '#3a5040', letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 2 }}>{k}</div>

          </div>
        ))}
      </div>

      {/* Past session result */}
      {isPast && session.result && (
        <div style={{ background: '#091209', border: '1px solid #182018', borderRadius: 10, padding: '12px 14px', marginBottom: 14 }}>
          {session.result.outcome && session.sessionType === 'tournament' && (

              <span style={{ fontFamily: "'League Spartan',sans-serif", fontWeight: 800, fontSize: 14, color: session.result.outcome === 'Won' ? '#3de05a' : session.result.outcome === 'Lost' ? '#e05a3d' : '#8aaa8a' }}>{session.result.outcome}</span>
            </div>
          )}
          {session.result.notes && (
            <div style={{ fontFamily: "'Quicksand',sans-serif", fontSize: 13, color: '#6a8a6a', lineHeight: 1.6 }}>{session.result.notes}</div>
          )}
        </div>
      )}

      {/* Zoom link */}
      {!isPast && (
        <div style={{ display: 'flex', gap: 10, alignItems: 'center', background: '#061206', border: '1px solid #1a2a1a', borderRadius: 9, padding: '10px 14px', marginBottom: 14 }}>
          <span style={{ fontFamily: 'monospace', fontSize: 11, color: '#3de05a', flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{session.zoomLink}</span>
          <button onClick={copyZoom} style={{ background: copied ? '#3de05a' : '#0d2010', border: `1px solid ${copied ? '#3de05a' : '#1e3020'}`, borderRadius: 6, padding: '5px 12px', fontFamily: "'League Spartan',sans-serif", fontWeight: 700, fontSize: 11, color: copied ? '#050d05' : '#5a8060', cursor: 'pointer', flexShrink: 0, transition: 'all 0.15s' }}>
            {copied ? 'Copied!' : 'Copy'}

        </div>
      )}

      {/* Actions */}
      {!isPast && (
        <button onClick={onMarkComplete} style={{ background: 'transparent', border: '1px solid #2a3e2a', borderRadius: 8, padding: '9px 18px', fontFamily: "'League Spartan',sans-serif", fontWeight: 700, fontSize: 12, color: '#5a8060', cursor: 'pointer', letterSpacing: '0.04em' }}>
          Mark Complete →
        </button>
      )}
    </div>
  );
}

// ── Booking Page ─────────────────────────────────────────────────────
function BookingPage({ preselectedCoach, onClearCoach, user, onRequireAuth }) {
  const [stage, setStage] = useState('engine');
  const [booking, setBooking] = useState(null);

  // Gate: must be logged in
  useEffect(() => {
    if (!user) {onRequireAuth();}
  }, [user]);

  if (!user) return (
    <div style={{ maxWidth: 500, margin: '0 auto', padding: '120px 24px', textAlign: 'center' }}>
      <div style={{ fontFamily: "'League Spartan',sans-serif", fontWeight: 900, fontSize: 28, color: '#d0e8d0', marginBottom: 12 }}>Sign in to Book</div>
      <div style={{ fontFamily: "'Quicksand',sans-serif", fontSize: 15, color: '#4a6050', marginBottom: 28 }}>Create a free account or sign in to book a session with one of our coaches.</div>
      <button onClick={onRequireAuth} style={{ background: '#3de05a', border: 'none', borderRadius: 11, padding: '14px 32px', fontFamily: "'League Spartan',sans-serif", fontWeight: 800, fontSize: 16, color: '#050d05', cursor: 'pointer' }}>Sign In / Create Account →</button>
    </div>);


  const [confirmedZoomLink, setConfirmedZoomLink] = useState(null);
  function handleEngineComplete(data) {setBooking(data);setStage('payment');}
  function handlePaySuccess(zoomLink) {
    if (user) {
      const session = buildSession(booking, zoomLink);
      saveUserSession(user.email, session);
      if (user.subscription === 'free' && booking.coach.level === 'Senior') {
        updateCurrentUser({ sessionsUsedThisMonth: (user.sessionsUsedThisMonth || 0) + 1 });
      }
    }
    setConfirmedZoomLink(zoomLink);
    authIncrementSessions();
    setStage('confirm');
  }
  function handleNewBooking() {onClearCoach && onClearCoach();setBooking(null);setConfirmedZoomLink(null);setStage('engine');}

  const stageTitle = { confirm: "You're All Set!", payment: 'Secure Payment', engine: 'Book a Session' }[stage];
  const stageSub = { confirm: 'Your Zoom session is scheduled and confirmed.', payment: 'One step away from your coaching session.', engine: 'Live 1-on-1 coaching via Zoom · Instant Zoom link on confirmation' }[stage];

  // Subscription plan restriction banner for free users
  const isFree = user.subscription === 'free';
  const seniorLeft = isFree ? Math.max(0, 5 - (user.sessionsUsedThisMonth || 0)) : null;
  const outOfSessions = false; // Free tier is unlimited; only Senior sessions are capped

  return (
    <div style={{ maxWidth: 800, margin: '0 auto', padding: '100px 24px 80px' }}>
      {/* Free plan notice */}
      {isFree && stage === 'engine' &&
      <div style={{ background: '#0a1a10', border: '1px solid #2a4030', borderRadius: 12, padding: '14px 18px', marginBottom: 24, display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 10 }}>
          <div style={{ fontFamily: "'Quicksand',sans-serif", fontSize: 13, color: '#5a8060' }}>
            <strong style={{ color: '#8ab0a0' }}>Free Plan</strong> · Unlimited sessions · {seniorLeft} guaranteed Senior session{seniorLeft !== 1 ? 's' : ''} remaining this month
          </div>
          <button style={{ background: '#3de05a', border: 'none', borderRadius: 7, padding: '7px 14px', fontFamily: "'League Spartan',sans-serif", fontWeight: 700, fontSize: 12, color: '#050d05', cursor: 'pointer' }}>Upgrade to Premium</button>
        </div>
      }

      <div style={{ textAlign: 'center', marginBottom: 48 }}>
        <div style={{ fontFamily: "'League Spartan',sans-serif", fontWeight: 900, fontSize: 'clamp(32px,5vw,52px)', color: '#e8f4e8', letterSpacing: '-0.02em' }}>{stageTitle}</div>
        <div style={{ fontFamily: "'Quicksand',sans-serif", fontSize: 15, color: '#4a6050', marginTop: 8 }}>{stageSub}</div>
        {stage === 'engine' && preselectedCoach &&
        <div style={{ display: 'inline-flex', alignItems: 'center', gap: 10, marginTop: 16, background: '#0a1e10', border: '1px solid #3de05a50', borderRadius: 28, padding: '8px 16px' }}>
            <CoachAvatar coach={preselectedCoach} size="xs" />
            <span style={{ fontFamily: "'Quicksand',sans-serif", fontSize: 13, color: '#7ab08a', fontWeight: 600 }}>Booking with {preselectedCoach.name}</span>
            <button onClick={() => onClearCoach && onClearCoach()} style={{ background: 'none', border: 'none', color: '#3a6040', cursor: 'pointer', fontSize: 18, lineHeight: 1, padding: '0 0 0 2px' }}>×</button>
          </div>
        }
      </div>

      {outOfSessions ?
      <div style={{ textAlign: 'center', padding: '40px 24px' }}>
          <div style={{ fontFamily: "'League Spartan',sans-serif", fontWeight: 900, fontSize: 22, color: '#e05a3d', marginBottom: 12 }}>Monthly limit reached</div>
          <div style={{ fontFamily: "'Quicksand',sans-serif", fontSize: 15, color: '#5a7060', marginBottom: 28, lineHeight: 1.7 }}>You've used all 5 sessions for this month on the Free plan. Upgrade to Premium for unlimited sessions and full coach selection.</div>
          <button style={{ background: '#3de05a', border: 'none', borderRadius: 12, padding: '15px 32px', fontFamily: "'League Spartan',sans-serif", fontWeight: 900, fontSize: 16, color: '#050d05', cursor: 'pointer' }}>Upgrade to Premium — $9.99/mo →</button>
        </div> :

      <>
          {stage === 'engine' && <BookingEngine onComplete={handleEngineComplete} preselectedCoach={preselectedCoach} userTier={user.subscription} currentUser={user} />}
          {stage === 'payment' && <PaymentPage booking={booking} onBack={() => setStage('engine')} onSuccess={handlePaySuccess} />}
          {stage === 'confirm' && <ConfirmationPage booking={booking} onNewBooking={handleNewBooking} zoomLink={confirmedZoomLink} />}
        </>
      }
    </div>);

}

// ── App Root ─────────────────────────────────────────────────────────
function App() {
  const [view, setView] = useState('home');
  const [user, setUser] = useState(() => getCurrentUser());
  const [preselectedCoach, setPreselectedCoach] = useState(null);
  const [showAuth, setShowAuth] = useState(false);
  const [authMode, setAuthMode] = useState('signup');
  const [tweaks, setTweaksState] = useState(TWEAK_DEFAULTS);
  const [tweaksVisible, setTweaksVisible] = useState(false);

  function setTweak(key, val) {
    const next = { ...tweaks, [key]: val };
    setTweaksState(next);
    window.parent && window.parent.postMessage({ type: '__edit_mode_set_keys', edits: next }, '*');
  }

  useEffect(() => {
    const handler = (e) => {
      if (!e.data) return;
      if (e.data.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent && window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  function handleSetView(v) {
    setView(v);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function handleBookCoach(coach) {
    if (!user) {setAuthMode('signup');setShowAuth(true);return;}
    setPreselectedCoach(coach);
    handleSetView('booking');
  }

  function handleAuthSuccess(authedUser) {
    setUser(authedUser);
    setShowAuth(false);
    if (authedUser.role === 'coach') {
      handleSetView('coach-portal');
      return;
    }
    if (!authedUser.subscription) {
      handleSetView('subscription');
    } else {
      if (preselectedCoach) handleSetView('booking');else
      handleSetView('account');
    }
  }

  function handleSubscriptionChosen(updatedUser) {
    setUser(updatedUser);
    if (preselectedCoach) handleSetView('booking');else
    handleSetView('home');
  }

  function handleSignOut() {
    authSignOut();
    setUser(null);
    setPreselectedCoach(null);
    handleSetView('home');
  }

  function handleRequireAuth() {
    setAuthMode('signup');
    setShowAuth(true);
  }

  return (
    <div style={{ minHeight: '100vh', background: '#060c06' }}>
      <Nav
        view={view} setView={handleSetView} user={user}
        onSignInClick={() => {setAuthMode('signin');setShowAuth(true);}}
        onSignOut={handleSignOut} />
      

      {view === 'home' && <HomePage setView={handleSetView} onBookCoach={handleBookCoach} onSignInClick={() => {setAuthMode('signup');setShowAuth(true);}} />}
      {view === 'team' && <TeamPage setView={handleSetView} onBookCoach={handleBookCoach} />}
      {view === 'coach-portal' && user?.role === 'coach' && <CoachPortalPage user={user} onSignOut={handleSignOut} />}
      {view === 'booking' && <BookingPage preselectedCoach={preselectedCoach} onClearCoach={() => setPreselectedCoach(null)} user={user} onRequireAuth={handleRequireAuth} />}
      {view === 'subscription' && user && <SubscriptionPage user={user} onChoose={handleSubscriptionChosen} />}
      {view === 'account' && user && <AccountDashboard user={user} onSignOut={handleSignOut} onUpgrade={() => handleSetView('subscription')} setView={handleSetView} />}
      {view === 'sessions' && user && <SessionsPage user={user} />}
      {view === 'account' && !user &&
      <div style={{ maxWidth: 500, margin: '0 auto', padding: '120px 24px', textAlign: 'center' }}>
          <div style={{ fontFamily: "'League Spartan',sans-serif", fontWeight: 900, fontSize: 26, color: '#d0e8d0', marginBottom: 12 }}>Sign in to view your Account</div>
          <button onClick={handleRequireAuth} style={{ background: '#3de05a', border: 'none', borderRadius: 11, padding: '14px 32px', fontFamily: "'League Spartan',sans-serif", fontWeight: 800, fontSize: 16, color: '#050d05', cursor: 'pointer' }}>Sign In →</button>
        </div>
      }
      {view === 'about' && <AboutPage />}

</script>
</body>
</html>
